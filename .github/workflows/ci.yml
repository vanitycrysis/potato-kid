name: CI

on:
  pull_request:
  push:
    branches: [main]

# Public repo (D-060): fork PRs run with a read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same PR replaces the run in progress. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs below run side by side. `ci` at the end is the one required check on
# `main` (branch protection): it passes only when every other job passed.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: potato-kid-web
          path: dist/
          retention-days: 30

  # The end-to-end suite, split across runners by spec file. Each runner keeps one worker:
  # the tests are tuned for it (docs/TESTING.md), and a second worker on the same machine
  # makes the timing-sensitive ones flaky.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Not `npm run e2e`: its pre-script would build a second time.
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The art sources against the asset contract, and every checked costume against the drawing
  # rules in every pose (docs/ART.md). Both rasterise in Chromium.
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The baked motion data matches its scripts; then the art contract; then every kid's
      # drawings in every pose and every frame of the clips it lives in.
      - run: npm run motion:check
      - run: npm run art:check
      - run: npm run art:kids

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: potato-kid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ci:
    if: always()
    needs: [check, e2e, art, android]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo "check: ${{ needs.check.result }}, e2e: ${{ needs.e2e.result }}, art: ${{ needs.art.result }}, android: ${{ needs.android.result }}"
          test "${{ needs.check.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.art.result }}" = success
          test "${{ needs.android.result }}" = success
