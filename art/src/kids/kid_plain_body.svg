<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Potato Kid — shared plain body</title>
  <desc>A broad cream potato with an uneven left shoulder, a shallow right-side dent, and an off-centre lower bulge. Tiny feet and two short sprout nubs retain the shared identity. Ground anchor: 128,224.</desc>
